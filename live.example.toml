# Copy to live.toml and edit. Broker login details do NOT go in this file:
# by default the bot uses whatever account the MT5 terminal is logged in to,
# or set MT5_LOGIN / MT5_PASSWORD / MT5_SERVER environment variables.
# Telegram alerts: set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.

[live]
symbol = "XAUUSD"              # exact name in your broker's Market Watch (XAUUSD, GOLD, XAUUSD.m, ...)
magic = 7861001                # tags the bot's orders; it ignores trades without this number
wait_after_open_minutes = 60   # skip the spread spike right after the daily rollover
max_spread = 1.0               # USD/oz; postpone trading while the spread is wider
max_wait_hours = 6             # then exits go through anyway and entries are skipped
deviation_points = 50          # max slippage on market orders, in points
allow_live = false             # must be true before it will touch a real-money account
dry_run = false                # true = log orders without sending them
poll_seconds = 60
state_dir = "state"
heartbeat_url = ""             # e.g. https://hc-ping.com/<your-uuid> to get alerted if the bot goes silent

# Must match the settings you validated in the backtest.
[strategy]
entry_lookback = 55
exit_lookback = 20
trend_lookback = 200
atr_lookback = 20
stop_atr = 2.0
allow_short = true
trail_atr = 0.0                # trailing stop in ATRs behind the close; 0 = off (try 3.0 in a backtest first)

[risk]
risk_per_trade = 0.01
max_leverage = 5.0
max_daily_loss = 0.03
max_drawdown = 0.20
# lot_step is taken from the broker's symbol settings when live.
