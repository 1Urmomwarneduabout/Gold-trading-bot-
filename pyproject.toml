[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldbot"
version = "0.1.0"
description = "Gold (XAUUSD) trend-following backtester with walk-forward and Monte Carlo validation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
goldbot = "goldbot.cli:main"

[tool.setuptools]
packages = ["goldbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
